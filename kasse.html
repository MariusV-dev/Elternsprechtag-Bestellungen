<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veranstaltungskasse</title><link rel="stylesheet" href="kasse.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="kasse.js"></script><link rel="stylesheet" href="modern.css"><script defer src="performance.js"></script></head><body><header><strong>Veranstaltungskasse</strong><a href="admin.html">Administration</a><button id="logout" hidden>Abmelden</button></header><main><p id="notice" role="status"></p><form id="login"><h1>Kassenanmeldung</h1><label>E-Mail<input id="email" type="email" required></label><label>Passwort<input id="password" type="password" required></label><button>Anmelden</button></form><div id="work" hidden><h1 id="event"></h1><div class="stationbar"><label>Kasse <select id="station"></select></label><button id="fullscreen">Vollbild</button><span id="connection" role="status"></span></div><div class="layout"><section><input id="search" placeholder="Produkte suchen" aria-label="Produkte suchen"><select id="category" aria-label="Kategorie"><option value="">Alle Kategorien</option></select><div id="products" class="products"></div></section><section><h2>Warenkorb</h2><button id="clear">Leeren</button><div id="cart"></div><p>Festpreise: <strong id="fixed"></strong></p><label>Freiwillige Spende (€)<input id="donation" type="number" min="0" step="0.01" value="0"></label><div id="quick"></div><h2>Gesamt: <span id="total"></span></h2><label>Gegeben (€)<input id="given" type="number" min="0" step="0.01"></label><p>Rückgeld: <strong id="change"></strong></p><button id="save" class="primary">Verkauf abschließen</button></section></div><section><h2>Letzte Verkäufe</h2><div id="history"></div></section></div></main></body></html>
