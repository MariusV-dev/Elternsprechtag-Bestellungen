<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veranstaltungskasse</title><link rel="stylesheet" href="kasse.css?v=13"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="kasse.js?v=13"></script><link rel="stylesheet" href="modern.css?v=13"><script defer src="performance.js"></script></head><body><header><a class="cash-brand" href="./"><span class="mark">E</span><span><strong>Eichendorff</strong><small>Veranstaltungskasse</small></span></a><a href="admin.html">Administration ↗</a><button id="logout" hidden>Abmelden</button></header><main><p id="notice" role="status"></p><form id="login"><h1>Kassenanmeldung</h1><label>E-Mail<input id="email" type="email" required></label><label>Passwort<input id="password" type="password" required></label><button>Anmelden</button></form><div id="work" hidden><h1 id="event"></h1><div class="stationbar"><label>Kasse <select id="station"></select></label><button id="fullscreen">Vollbild</button><span id="connection" role="status"></span></div><div class="layout"><section><input id="search" placeholder="Produkte suchen" aria-label="Produkte suchen"><select id="category" aria-label="Kategorie"><option value="">Alle Kategorien</option></select><div id="products" class="products"></div></section><section><div class="cart-head"><h2>Warenkorb</h2><button id="clear">Leeren</button></div><div id="cart"></div><p>Festpreise: <strong id="fixed"></strong></p><label>Spendenanteil (€)<input id="donation" type="number" min="0" step="0.01" value="0"></label><h2>Gesamt: <span id="total"></span></h2><label>Zahlungsart<select id="method"><option value="cash">Bar</option><option value="paypal">PayPal (extern)</option></select></label><label id="given-label">Erhaltener Gesamtbetrag (€)<input id="given" type="number" min="0" step="0.01"></label><div id="quick"></div><label class="auto-option"><input type="checkbox" id="auto-donation" checked> Überschuss als Spende erfassen</label><button id="rest">Rest als Spende übernehmen</button><p>Rückgeld: <strong id="change"></strong></p><button id="save" class="primary">Verkauf abschließen</button></section></div><section><h2>Letzte aktive Verkäufe</h2><div id="history"></div></section></div><dialog id="edit-sale"><form method="dialog"><h2>Verkauf korrigieren</h2><p id="edit-info"></p><label>Erhaltene Spende (€)<input id="edit-donation" type="number" min="0" max="10000" step="0.01" required></label><label>Zahlungsart<select id="edit-method"><option value="cash">Bar</option><option value="paypal">PayPal</option><option value="unknown">Nicht erfasst</option></select></label><div class="cart-head"><button value="cancel" formnovalidate>Abbrechen</button><button id="edit-save" value="save">Speichern</button></div></form></dialog></main></body></html>
